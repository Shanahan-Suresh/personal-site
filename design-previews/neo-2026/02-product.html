<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 Product · Shanahan Suresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a product storefront. Flat at rest, the shadow only appears when you reach for something. Pink leads, yellow means "act". */
:root {
  --bg: #ffffff; --ink: #000000; --muted: #4b4b4b; --card: #ffffff; --soft: #f4f4f0;
  --pink: #ff90e8; --yellow: #ffc900; --teal: #23a094; --on: #000000;
  --display: "Gabarito", "Arial Black", sans-serif;
  --body: "Figtree", system-ui, sans-serif;
  --r: 6px; --bw: 2px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0b; --ink: #ffffff; --muted: #b5b5b5; --card: #161616; --soft: #1e1e1e; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0b0b0b; --ink: #ffffff; --muted: #b5b5b5; --card: #161616; --soft: #1e1e1e; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--body); }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.02em; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)); }

.nav { border-bottom: var(--bw) solid var(--ink); background: var(--bg); position: sticky; top: 0; z-index: 5; }
.nav .wrap { display: flex; align-items: center; gap: 8px; height: 68px; }
.logo { display: flex; align-items: center; gap: 10px; font: 800 20px var(--display); text-decoration: none; margin-right: auto; }
.logo i { width: 34px; height: 34px; border-radius: 50%; background: var(--pink); border: var(--bw) solid var(--ink); display: grid; place-items: center; font: 900 16px var(--display); font-style: normal; color: #000; }
.nav a.l { padding: 8px 14px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; border: var(--bw) solid transparent; }
.nav a.l:hover { border-color: var(--ink); }
.tbtn { height: 40px; width: 40px; border-radius: 999px; border: var(--bw) solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.tbtn svg { width: 18px; }

.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: var(--r); border: var(--bw) solid #000; font: 700 16px/1 var(--body); text-decoration: none; color: #000; background: var(--yellow); transition: transform .12s, box-shadow .12s; }
.btn.dark { background: #000; color: #fff; border-color: #000; }
.btn:hover { transform: translate(-4px, -4px); box-shadow: 4px 4px 0 #000; }
.btn:active { transform: none; box-shadow: none; }

.hero { background: var(--pink); color: #000; border-bottom: var(--bw) solid var(--ink); }
.hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; padding-block: 80px; }
.hero h1 { font-size: clamp(48px, 7vw, 100px); line-height: 1.04; font-weight: 900; letter-spacing: -.035em; }
.hero h1 u { text-decoration: none; background: #fff; border: var(--bw) solid #000; border-radius: var(--r); padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.hero p { font-size: 20px; max-width: 46ch; margin: 28px 0 34px; font-weight: 500; }
.hero .ctas { display: flex; gap: 14px; flex-wrap: wrap; }
.stack { position: relative; min-height: 420px; }
.stack .p { position: absolute; width: 78%; background: #fff; border: var(--bw) solid #000; border-radius: var(--r); overflow: hidden; }
.stack .p img { aspect-ratio: 16/10; object-fit: cover; object-position: top; width: 100%; border-bottom: var(--bw) solid #000; }
.stack .p .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; font-weight: 600; font-size: 15px; }
.stack .p .price { background: var(--yellow); border: var(--bw) solid #000; padding: 3px 10px; border-radius: var(--r); font: 800 15px var(--display); white-space: nowrap; }
.stack .p1 { top: 0; right: 0; transform: rotate(2deg); }
.stack .p2 { bottom: 0; left: 0; transform: rotate(-2deg); box-shadow: 6px 6px 0 #000; }

section { padding-block: 96px 0; }
.sh { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 36px; flex-wrap: wrap; }
.sh h2 { font-size: clamp(36px, 5vw, 64px); line-height: 1; font-weight: 900; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { font: 600 15px var(--body); padding: 9px 16px; border-radius: 999px; border: var(--bw) solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.item { border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--card); overflow: hidden; display: flex; flex-direction: column; transition: transform .14s, box-shadow .14s; }
.item:hover { transform: translate(-4px, -4px); box-shadow: 6px 6px 0 var(--ink); }
.item .thumb { background: var(--pink); border-bottom: var(--bw) solid var(--ink); }
.item:nth-child(3n+2) .thumb { background: var(--yellow); }
.item:nth-child(3n+3) .thumb { background: var(--teal); }
.item img { aspect-ratio: 16/10; object-fit: cover; object-position: top; width: 100%; }
.item .in { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.item .grp { font-size: 13px; font-weight: 700; color: var(--muted); }
.item h3 { font-size: 22px; line-height: 1.15; font-weight: 800; }
.item p { margin: 0; font-size: 15.5px; color: var(--muted); }
.item .foot { margin-top: auto; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: var(--bw) solid var(--ink); }
.item .fact { font: 800 20px var(--display); }
.item .fact small { font: 500 13px var(--body); color: var(--muted); margin-left: 6px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border: 1.5px solid var(--ink); border-radius: 999px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.item.wide { grid-column: span 2; flex-direction: row; }
.item.wide .thumb { flex: 1.2; border-bottom: 0; border-right: var(--bw) solid var(--ink); display: flex; align-items: center; padding: 20px; }
.item.wide .thumb img { border: var(--bw) solid #000; border-radius: var(--r); aspect-ratio: auto; height: auto; }
.item.wide .in { flex: 1; padding: 26px; }
.item.wide h3 { font-size: 30px; }

.about { display: grid; grid-template-columns: 380px 1fr; gap: 56px; align-items: start; }
.about figure { margin: 0; border: var(--bw) solid var(--ink); border-radius: var(--r); overflow: hidden; background: var(--yellow); }
.about figure img { aspect-ratio: 4/5; object-fit: cover; width: 100%; }
.about h3 { font-size: 34px; line-height: 1.1; margin-bottom: 20px; font-weight: 800; }
.about p { margin: 0 0 16px; max-width: 58ch; }
.princ { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; }
.princ div { border: var(--bw) solid #000; border-radius: var(--r); padding: 20px; color: #000; }
.princ div:nth-child(1) { background: var(--pink); }
.princ div:nth-child(2) { background: var(--yellow); }
.princ div:nth-child(3) { background: #9fe3d8; }
.princ h4 { font-size: 19px; line-height: 1.2; margin-bottom: 8px; font-weight: 800; }
.princ p { margin: 0; font-size: 15px; }

.now { background: var(--soft); border: var(--bw) solid var(--ink); border-radius: var(--r); padding: 36px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; }
.now p { margin: 0 0 14px; }
.now h4 { font-size: 20px; margin-bottom: 12px; }
.beyond { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
.beyond figure { margin: 0; border: var(--bw) solid var(--ink); border-radius: var(--r); overflow: hidden; background: var(--card); }
.beyond img { aspect-ratio: 1/1; object-fit: cover; width: 100%; border-bottom: var(--bw) solid var(--ink); }
.beyond figcaption { padding: 12px 14px; font-size: 14.5px; color: var(--muted); }
.beyond b { display: block; color: var(--ink); font-size: 15.5px; }

.contact { margin-top: 112px; background: var(--yellow); color: #000; border-top: var(--bw) solid var(--ink); }
.contact .wrap { padding-block: 96px; text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.contact h2 { font-size: clamp(64px, 10vw, 150px); line-height: .85; font-weight: 900; letter-spacing: -.045em; }
.contact p { font-size: 19px; margin: 0 0 24px; font-weight: 500; }
.mailbox { display: flex; border: var(--bw) solid #000; border-radius: var(--r); background: #fff; overflow: hidden; }
.mailbox span { flex: 1; padding: 14px 16px; font: 600 16px var(--body); user-select: all; min-width: 0; overflow-wrap: anywhere; }
.mailbox button { border: 0; border-left: var(--bw) solid #000; background: #000; color: #fff; font: 700 15px var(--body); padding: 0 20px; cursor: pointer; }
.links { display: flex; gap: 20px; margin-top: 18px; font-weight: 600; flex-wrap: wrap; }
footer { background: #000; color: #fff; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; padding-block: 22px; font-size: 14px; }

@media (max-width: 960px) {
  .hero .wrap, .about, .now, .contact .wrap { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr 1fr; }
  .item.wide { grid-column: span 2; }
  .beyond { grid-template-columns: 1fr 1fr; }
  .about figure { max-width: 340px; }
}
@media (max-width: 600px) {
  .nav a.l { display: none; }
  .hero .wrap { padding-block: 48px; }
  .stack { min-height: 300px; }
  .grid { grid-template-columns: 1fr; }
  .item.wide { grid-column: auto; flex-direction: column; }
  .item.wide .thumb { border-right: 0; border-bottom: var(--bw) solid var(--ink); }
  .princ { grid-template-columns: 1fr; }
  .now { padding: 22px; }
  section { padding-block: 72px 0; }
}
@media (prefers-reduced-motion: reduce) { .item, .btn { transition: none; } }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="logo" href="#top"><i>S</i>Shanahan Suresh</a>
  <a class="l" href="#work">Work</a><a class="l" href="#about">About</a><a class="l" href="#contact">Contact</a>
  <button class="tbtn" id="theme" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</div></header>

<div class="hero" id="top"><div class="wrap">
  <div>
    <h1>I build <span style="white-space:nowrap">full-stack</span> products &amp; <u>AI tooling.</u></h1>
    <p id="lead"></p>
    <div class="ctas"><a class="btn" href="#work">See what I build</a><a class="btn dark" href="#contact">Say hi</a></div>
  </div>
  <div class="stack" aria-hidden="true">
    <div class="p p1"><img src="img/digest.webp" alt=""><div class="meta"><span>Tech Scout Digest</span><span class="price">Daily</span></div></div>
    <div class="p p2"><img src="img/rsvp.webp" alt=""><div class="meta"><span>RSVP &amp; check-in</span><span class="price">75,000 guests</span></div></div>
  </div>
</div></div>

<main class="wrap">
  <section id="work">
    <div class="sh"><h2>Things I've built</h2>
      <div class="filters" role="group" aria-label="Filter projects" id="filters"></div></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="about">
    <div class="about">
      <figure><img src="img/portrait.webp" alt="Shanahan Suresh smiling in a navy jacket and white shirt."></figure>
      <div><h3 id="aboutTitle"></h3><div id="aboutBody"></div><div class="princ" id="princ"></div></div>
    </div>
  </section>

  <section>
    <div class="now"><div><h4>What I'm into lately</h4><div id="now"></div></div>
      <div><h4>On the learning list</h4><div class="chips" id="learn"></div></div></div>
    <div class="beyond" id="beyond"></div>
  </section>
</main>

<section class="contact" id="contact"><div class="wrap">
  <h2>Let's build.</h2>
  <div><p id="clead"></p>
    <div class="mailbox"><span id="mail">hello@shanahansuresh.com</span><button id="copy" type="button">Copy</button></div>
    <div class="links"><a id="li"></a><a id="gh"></a></div></div>
</div></section>
<footer><div class="wrap"><span>© 2026 Shanahan Suresh</span><span>Colophon · Source ↗</span></div></footer>

<script src="data.js"></script>
<script>
const S = SITE, $ = (id) => document.getElementById(id);
$("lead").textContent = S.lead;
$("aboutTitle").textContent = S.aboutTitle;
$("aboutBody").innerHTML = S.about.map((p) => `<p>${esc(p)}</p>`).join("");
$("princ").innerHTML = S.principles.map((p) => `<div><h4>${esc(p.title)}</h4><p>${esc(p.body)}</p></div>`).join("");
const card = (p) => `<article class="item${p.featured ? " wide" : ""}" data-g="${esc(p.group)}">
  <div class="thumb"><img src="${p.img}" alt=""></div>
  <div class="in"><span class="grp">${esc(p.group)}</span><h3>${esc(p.title)}</h3>
  <p>${esc(p.featured ? lede(p.body) : p.short)}</p>
  <div class="chips">${p.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
  <div class="foot"><span class="fact">${esc(p.fact[0])}<small>${esc(p.fact[1])}</small></span></div></div></article>`;
const order = ["rsvp", "ohse", "hr", "digest", "censorit", "mcp", "heatgen"];
const list = order.map((id) => S.projects.find((p) => p.id === id));
const render = (g) => { $("grid").innerHTML = list.filter((p) => g === "All" || p.group === g).map(card).join(""); };
const fs = ["All", "Personal", "Corporate work", "Academic"];
$("filters").innerHTML = fs.map((f, i) => `<button type="button" aria-pressed="${i === 0}">${f}</button>`).join("");
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  $("filters").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render(b.textContent);
});
render("All");
$("now").innerHTML = S.now.map((p) => `<p>${esc(p)}</p>`).join("");
$("learn").innerHTML = S.learning.map((x) => `<span class="chip">${x}</span>`).join("");
$("beyond").innerHTML = S.interests.map((i) => `<figure><img src="${i.img}" alt="${esc(i.alt)}"><figcaption><b>${esc(i.title)}</b>${esc(i.caption)}</figcaption></figure>`).join("");
$("clead").textContent = S.contactLead;
$("li").textContent = "LinkedIn ↗"; $("li").href = S.linkedin.href;
$("gh").textContent = "GitHub ↗"; $("gh").href = S.github.href;
$("copy").addEventListener("click", () => {
  const done = () => { $("copy").textContent = "Copied"; setTimeout(() => ($("copy").textContent = "Copy"), 1600); };
  navigator.clipboard?.writeText(S.email).then(done, () => { getSelection().selectAllChildren($("mail")); });
});
wireTheme($("theme"));
</script>
</body>
</html>
