<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- note.svg — single eighth note (quaver) in blue (#2b4cf0) with white keyline + black outline -->
  <!-- Composed of: filled oval notehead, vertical stem, and curved flag -->

  <defs>
    <!-- Notehead: tilted ellipse at bottom-left -->
    <ellipse id="notehead" cx="38" cy="72" rx="13" ry="9.5"
             transform="rotate(-20 38 72)" />
    <!-- Stem: vertical rect from notehead top to flag top -->
    <rect id="stem" x="49.5" y="24" width="7" height="48" rx="3" ry="3" />
    <!-- Flag: sweeping curve from stem top -->
    <path id="flag"
      d="M 56.5 24
         C 80 28, 80 45, 62 52" />
  </defs>

  <!-- White keyline layer -->
  <use href="#notehead" fill="none" stroke="#ffffff" stroke-width="18" />
  <use href="#stem"     fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" />
  <use href="#flag"     fill="none" stroke="#ffffff" stroke-width="14"
       stroke-linecap="round" stroke-linejoin="round" />

  <!-- Black outline layer -->
  <use href="#notehead" fill="none" stroke="#0d0d0d" stroke-width="8" />
  <use href="#stem"     fill="none" stroke="#0d0d0d" stroke-width="8" stroke-linejoin="round" />
  <use href="#flag"     fill="none" stroke="#0d0d0d" stroke-width="8"
       stroke-linecap="round" stroke-linejoin="round" />

  <!-- Blue fill -->
  <use href="#notehead" fill="#2b4cf0" stroke="none" />
  <use href="#stem"     fill="#2b4cf0" stroke="none" />
  <!-- Flag is a stroke-only shape — repaint with blue stroke -->
  <use href="#flag" fill="none" stroke="#2b4cf0" stroke-width="8"
       stroke-linecap="round" stroke-linejoin="round" />
</svg>
