<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- question.svg — bold "?" in blue (#2b4cf0) with white keyline + black outline -->
  <!-- Path: question mark hook built as a single thick path + dot -->

  <!-- White keyline layer -->
  <g stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Hook of "?" -->
    <path d="M 34 32
             C 34 20, 66 20, 66 35
             C 66 47, 50 47, 50 58"
          stroke-width="24" />
    <!-- Dot of "?" -->
    <circle cx="50" cy="76" r="7" stroke-width="18" />
  </g>

  <!-- Black outline layer -->
  <g stroke="#0d0d0d" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M 34 32
             C 34 20, 66 20, 66 35
             C 66 47, 50 47, 50 58"
          stroke-width="14" />
    <circle cx="50" cy="76" r="7" stroke-width="8" />
  </g>

  <!-- Blue fill / solid stroke (painted over outline, same width as outline for opaque fill) -->
  <path d="M 34 32
           C 34 20, 66 20, 66 35
           C 66 47, 50 47, 50 58"
        fill="none" stroke="#2b4cf0" stroke-width="14"
        stroke-linejoin="round" stroke-linecap="round" />
  <circle cx="50" cy="76" r="7" fill="#2b4cf0" stroke="none" />
</svg>
