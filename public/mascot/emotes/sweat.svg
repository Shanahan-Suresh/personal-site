<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- sweat.svg — anime sweat-drop teardrop in blue (#2b4cf0) with white keyline + black outline -->
  <!-- Classic anime sweat: narrow at top, rounds into a full teardrop at bottom -->

  <defs>
    <!-- Teardrop: pointed top, circular bottom -->
    <path id="drop"
      d="M 50 14
         C 50 14, 68 40, 68 60
         C 68 72, 60 82, 50 82
         C 40 82, 32 72, 32 60
         C 32 40, 50 14, 50 14
         Z" />
  </defs>

  <!-- White keyline -->
  <use href="#drop" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" />

  <!-- Black outline -->
  <use href="#drop" fill="none" stroke="#0d0d0d" stroke-width="8" stroke-linejoin="round" />

  <!-- Blue fill -->
  <use href="#drop" fill="#2b4cf0" stroke="none" />

  <!-- White highlight: small teardrop-shaped blob in upper-left of drop -->
  <ellipse cx="43" cy="46" rx="5.5" ry="9"
           fill="#ffffff" opacity="0.7"
           transform="rotate(-15 43 46)" />
  <!-- Tiny circular catchlight below it -->
  <circle cx="44" cy="60" r="2.5" fill="#ffffff" opacity="0.45" />
</svg>
