<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Warm paper background -->
  <rect width="1200" height="630" fill="#f5f2e9"/>

  <!-- Hard offset shadow block (ink, offset 12px) -->
  <rect x="44" y="44" width="1112" height="542" fill="#0d0d0d"/>

  <!-- Main bordered card -->
  <rect x="32" y="32" width="1112" height="542" fill="#f5f2e9" stroke="#0d0d0d" stroke-width="4"/>

  <!-- Coral accent stripe top-left -->
  <rect x="32" y="32" width="320" height="12" fill="#ff5436"/>

  <!-- Blue accent block — top-right corner sticker area -->
  <rect x="980" y="32" width="164" height="80" fill="#2b4cf0" stroke="#0d0d0d" stroke-width="3"/>
  <text x="1062" y="83" font-family="Arial Black, Impact, sans-serif" font-size="13" font-weight="900" fill="#f5f2e9" text-anchor="middle" letter-spacing="2">S·S</text>

  <!-- Acid-yellow asterisk sticker (bottom-right) -->
  <rect x="980" y="490" width="164" height="84" fill="#e8ff2a" stroke="#0d0d0d" stroke-width="3" transform="rotate(-2 1062 532)"/>
  <text x="1062" y="540" font-family="Arial Black, Impact, sans-serif" font-size="32" font-weight="900" fill="#0d0d0d" text-anchor="middle" dominant-baseline="middle" transform="rotate(-2 1062 532)">✳</text>

  <!-- Main display name — Anton-style, uppercase, oversized -->
  <text x="72" y="240" font-family="Anton, Arial Black, Impact, sans-serif" font-size="148" font-weight="900" fill="#0d0d0d" letter-spacing="-2">SHANAHAN</text>
  <text x="72" y="390" font-family="Anton, Arial Black, Impact, sans-serif" font-size="148" font-weight="900" fill="#0d0d0d" letter-spacing="-2">SURESH</text>

  <!-- Coral underline accent bar under "SURESH" -->
  <rect x="72" y="400" width="560" height="8" fill="#ff5436"/>

  <!-- Subtitle in monospace -->
  <text x="72" y="480" font-family="Courier New, Courier, monospace" font-size="24" font-weight="400" fill="#0d0d0d" letter-spacing="3">PRODUCT-MINDED SOFTWARE ENGINEER</text>

  <!-- URL caption -->
  <text x="72" y="530" font-family="Courier New, Courier, monospace" font-size="18" fill="#3c3a34" letter-spacing="2">shanahansuresh.dev</text>
</svg>
